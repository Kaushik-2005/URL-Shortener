name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      COMPOSE_PROJECT_NAME: url-shortener-ci
      POSTGRES_ADMIN_PASSWORD: ci-admin-password
      APP_DATABASE_PASSWORD: ci-app-password
      COMPOSE_DATABASE_URL: "postgres://url_shortener_dev:ci-app-password@postgres:5432/url_shortener?sslmode=disable"
      MANAGEMENT_API_KEY: ci-management-key
      TEST_DATABASE_URL: "postgres://url_shortener_dev:ci-app-password@127.0.0.1:5433/url_shortener?sslmode=disable"
      TEST_REDIS_URL: "redis://127.0.0.1:6380/0"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd/server)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Start integration services
        run: docker compose up --detach --wait postgres redis

      - name: Apply migrations
        run: docker compose run --rm migrate

      - name: Run unit and integration tests
        run: go test -race -count=1 -v ./...

      - name: Measure cold and warm cache-aside lookups
        run: >-
          go test ./cmd/server -run '^$'
          -bench '^BenchmarkCachedStoreLookup$'
          -benchmem -benchtime=100x -count=5

      - name: Build and start application
        run: docker compose up --detach --build app

      - name: Check application readiness and health
        shell: bash
        run: |
          ready=false

          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:8080/readyz; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "Application did not become ready"
            exit 1
          fi

          curl --fail --silent --show-error --max-time 5 \
            http://127.0.0.1:8080/healthz

      - name: Check URL creation, redirects, statistics, and deletion
        shell: bash
        run: |
          base_url=http://127.0.0.1:8080
          destination=https://example.com/ci-smoke
          body_file="$RUNNER_TEMP/smoke-body.json"
          headers_file="$RUNNER_TEMP/smoke-headers.txt"

          expect_status() {
            local expected="$1"
            shift
            local actual
            actual=$(curl --silent --show-error --max-time 10 \
              --output "$body_file" --dump-header "$headers_file" \
              --write-out '%{http_code}' "$@")
            if [ "$actual" != "$expected" ]; then
              printf 'HTTP status: got %s, want %s\n' "$actual" "$expected"
              cat "$body_file"
              return 1
            fi
          }

          expect_status 201 \
            --header 'Content-Type: application/json' \
            --data '{"url":"https://example.com/ci-smoke"}' \
            "$base_url/api/v1/urls"

          code=$(jq --exit-status --raw-output \
            '.code | select(type == "string" and length > 0)' "$body_file")
          jq --exit-status --arg url "$destination" \
            --arg short_url "$base_url/$code" \
            '.url == $url and .short_url == $short_url' "$body_file"
          metadata_url="$base_url/api/v1/urls/$code"

          expect_status 200 "$metadata_url"
          jq --exit-status --arg code "$code" --arg url "$destination" \
            '.code == $code and .url == $url' "$body_file"

          expect_status 302 "$base_url/$code"
          tr -d '\r' < "$headers_file" | grep --fixed-strings --line-regexp \
            "Location: $destination"

          expect_status 302 --head "$base_url/$code"
          tr -d '\r' < "$headers_file" | grep --fixed-strings --line-regexp \
            "Location: $destination"

          expect_status 401 "$metadata_url/stats"
          expect_status 401 --request DELETE "$metadata_url"
          expect_status 200 \
            --header "Authorization: Bearer $MANAGEMENT_API_KEY" \
            "$metadata_url/stats"
          jq --exit-status --arg code "$code" \
            '.code == $code and .total_clicks == 1 and
             (.daily | length) == 1 and .daily[0].clicks == 1' "$body_file"

          docker compose restart app
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 \
              "$base_url/readyz"; then
              break
            fi
            sleep 1
          done
          expect_status 200 "$base_url/readyz"

          expect_status 200 "$metadata_url"
          jq --exit-status --arg code "$code" --arg url "$destination" \
            '.code == $code and .url == $url' "$body_file"
          expect_status 200 \
            --header "Authorization: Bearer $MANAGEMENT_API_KEY" \
            "$metadata_url/stats"
          jq --exit-status --arg code "$code" \
            '.code == $code and .total_clicks == 1 and
             (.daily | length) == 1 and .daily[0].clicks == 1' "$body_file"

          expect_status 204 --request DELETE \
            --header "Authorization: Bearer $MANAGEMENT_API_KEY" \
            "$metadata_url"
          test ! -s "$body_file"
          expect_status 404 "$metadata_url"
          expect_status 404 "$base_url/$code"
          expect_status 404 \
            --header "Authorization: Bearer $MANAGEMENT_API_KEY" \
            "$metadata_url/stats"

      - name: Check graceful container shutdown
        shell: bash
        run: |
          container_id=$(docker compose ps --all --quiet app)
          test -n "$container_id"
          started_at=$(docker inspect --format '{{.State.StartedAt}}' "$container_id")
          docker compose stop --timeout 10 app
          exit_code=$(docker inspect --format '{{.State.ExitCode}}' "$container_id")
          if [ "$exit_code" != 0 ]; then
            printf 'Application exit code: got %s, want 0\n' "$exit_code"
            exit 1
          fi
          docker logs --since "$started_at" "$container_id" 2>&1 | grep --fixed-strings \
            'Server stopped cleanly'

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100 app migrate postgres redis

      - name: Stop integration services
        if: always()
        run: docker compose down --remove-orphans
