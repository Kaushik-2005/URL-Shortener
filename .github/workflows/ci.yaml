name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      COMPOSE_PROJECT_NAME: url-shortener-ci
      POSTGRES_ADMIN_PASSWORD: ci-admin-password
      APP_DATABASE_PASSWORD: ci-app-password
      COMPOSE_DATABASE_URL: "postgres://url_shortener_dev:ci-app-password@postgres:5432/url_shortener?sslmode=disable"
      MANAGEMENT_API_KEY: ci-management-key
      TEST_DATABASE_URL: "postgres://url_shortener_dev:ci-app-password@127.0.0.1:5433/url_shortener?sslmode=disable"
      TEST_REDIS_URL: "redis://127.0.0.1:6380/0"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd/server)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Start integration services
        run: docker compose up --detach --wait postgres redis

      - name: Apply migrations
        run: docker compose run --rm migrate

      - name: Run unit and integration tests
        run: go test -race -count=1 -v ./...

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100 postgres redis

      - name: Stop integration services
        if: always()
        run: docker compose down --remove-orphans
